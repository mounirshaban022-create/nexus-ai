<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Warm terracotta gradients (NEXUS Ivory theme) -->
    <linearGradient id="nexusGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8734A"/>
      <stop offset="55%" stop-color="#D9583B"/>
      <stop offset="100%" stop-color="#C0448C"/>
    </linearGradient>
    <linearGradient id="nexusGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E89B4A"/>
      <stop offset="100%" stop-color="#D9583B"/>
    </linearGradient>
    <linearGradient id="nexusStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8734A"/>
      <stop offset="100%" stop-color="#C0448C"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Data pulse along connection lines -->
    <radialGradient id="pulseDot">
      <stop offset="0%" stop-color="#F5C8B8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#E8734A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background: warm ivory rounded square -->
  <rect width="512" height="512" rx="112" fill="#FAF9F5"/>

  <!-- Hexagonal connection frame (nexus = connection point) -->
  <g fill="none" stroke="url(#nexusStroke)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <path d="M 256 96 L 366 160 L 366 288 L 256 352 L 146 288 L 146 160 Z" opacity="0.35" stroke-width="6"/>
  </g>

  <!-- The N: two vertical stems + diagonal bridge, ribbon style -->
  <g filter="url(#softGlow)">
    <!-- Left stem -->
    <path d="M 196 148 L 236 148 L 236 364 L 196 364 Z" fill="url(#nexusGrad2)"/>
    <!-- Right stem -->
    <path d="M 276 148 L 316 148 L 316 364 L 276 364 Z" fill="url(#nexusGrad1)"/>
    <!-- Diagonal bridge -->
    <path d="M 226 168 L 266 168 L 286 208 L 246 208 Z" fill="url(#nexusGrad1)" opacity="0.95"/>
    <path d="M 226 264 L 266 264 L 286 304 L 246 304 Z" fill="url(#nexusGrad1)" opacity="0.95"/>
    <path d="M 231 208 L 271 208 L 291 248 L 251 248 Z" fill="url(#nexusGrad2)" opacity="0.9"/>
    <path d="M 231 304 L 271 304 L 291 344 L 251 344 Z" fill="url(#nexusGrad2)" opacity="0.9"/>
  </g>

  <!-- Nexus nodes at hexagon corners (animated pulses) -->
  <g>
    <circle cx="256" cy="96" r="14" fill="url(#nexusGrad1)">
      <animate attributeName="r" values="10;16;10" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="366" cy="160" r="10" fill="url(#nexusGrad1)">
      <animate attributeName="r" values="7;13;7" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="366" cy="288" r="10" fill="url(#nexusGrad1)">
      <animate attributeName="r" values="7;13;7" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="256" cy="352" r="14" fill="url(#nexusGrad1)">
      <animate attributeName="r" values="10;16;10" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="146" cy="288" r="10" fill="url(#nexusGrad1)">
      <animate attributeName="r" values="7;13;7" dur="3s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="146" cy="160" r="10" fill="url(#nexusGrad1)">
      <animate attributeName="r" values="7;13;7" dur="3s" begin="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Connection lines with traveling data pulses -->
  <g stroke="url(#nexusStroke)" stroke-width="4" stroke-linecap="round" opacity="0.5">
    <line x1="256" y1="96" x2="366" y2="160">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="366" y1="160" x2="366" y2="288">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="366" y1="288" x2="256" y2="352">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" begin="1s" repeatCount="indefinite"/>
    </line>
    <line x1="256" y1="352" x2="146" y2="288">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </line>
    <line x1="146" y1="288" x2="146" y2="160">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" begin="2s" repeatCount="indefinite"/>
    </line>
    <line x1="146" y1="160" x2="256" y2="96">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" begin="2.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Orbiting data particles -->
  <circle r="5" fill="#E8734A" opacity="0.9">
    <animateMotion
      dur="6s" repeatCount="indefinite"
      path="M 256 96 L 366 160 L 366 288 L 256 352 L 146 288 L 146 160 Z"
    />
  </circle>
  <circle r="3.5" fill="#C0448C" opacity="0.8">
    <animateMotion
      dur="6s" begin="-3s" repeatCount="indefinite"
      path="M 256 352 L 366 288 L 366 160 L 256 96 L 146 160 L 146 288 Z"
    />
  </circle>

  <!-- Chat bubble accent (AI assistant identity) -->
  <g transform="translate(330, 356)">
    <path d="M 0 12 Q 0 0 14 0 L 38 0 Q 52 0 52 12 L 52 26 Q 52 38 38 38 L 20 38 L 8 50 L 10 38 Q 0 36 0 26 Z" fill="#D9583B" opacity="0.96"/>
    <circle cx="16" cy="19" r="3.5" fill="#FAF9F5">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="26" cy="19" r="3.5" fill="#FAF9F5">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="36" cy="19" r="3.5" fill="#FAF9F5">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Wordmark -->
  <text x="256" y="452" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="44" font-weight="800" letter-spacing="6" fill="#2B2620">NEXUS</text>
  <text x="256" y="482" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="600" letter-spacing="9" fill="#D9583B">AI THAT CONNECTS</text>
</svg>
